    <path d="M45 36 Q52 24 45 12" fill="none" stroke="#EA580C" stroke-width="3" stroke-linecap="round" opacity="0.7"/>
    <path d="M57 34 Q52 24 59 14" fill="none" stroke="#EA580C" stroke-width="3" stroke-linecap="round" opacity="0.7"/>
