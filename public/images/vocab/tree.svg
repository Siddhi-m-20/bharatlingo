<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-tree" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F0FDF4"/>
      <stop offset="100%" stop-color="#DCFCE7"/>
    </linearGradient>
    <linearGradient id="foliage-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4ADE80"/>
      <stop offset="100%" stop-color="#16A34A"/>
    </linearGradient>
  </defs>
  <rect width="160" height="160" rx="24" fill="url(#bg-tree)"/>
  <g transform="translate(35, 25)">
    <!-- Trunk -->
    <rect x="36" y="65" width="18" height="45" rx="3" fill="#78350F" stroke="#451A03" stroke-width="3"/>
    <!-- Bottom Foliage Layer -->
    <circle cx="45" cy="65" r="32" fill="url(#foliage-grad)" stroke="#15803D" stroke-width="3.5"/>
    <!-- Top Foliage Layer -->
    <circle cx="45" cy="42" r="26" fill="#22C55E" stroke="#15803D" stroke-width="3"/>
    <!-- Small accent highlights -->
    <circle cx="34" cy="38" r="5" fill="#86EFAC" opacity="0.6"/>
    <circle cx="56" cy="56" r="6" fill="#86EFAC" opacity="0.6"/>
  </g>
</svg>
