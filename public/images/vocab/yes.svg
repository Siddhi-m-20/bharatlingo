<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-yes" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F0FDF4"/>
      <stop offset="100%" stop-color="#DCFCE7"/>
    </linearGradient>
    <linearGradient id="badge-yes" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
  </defs>
  <rect width="160" height="160" rx="24" fill="url(#bg-yes)"/>
  <g transform="translate(30, 30)">
    <!-- Outer Shield / Circle -->
    <circle cx="50" cy="50" r="42" fill="url(#badge-yes)" stroke="#047857" stroke-width="4"/>
    <circle cx="50" cy="50" r="34" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-dasharray="4,4"/>
    <!-- Clean Crisp Checkmark Icon -->
    <polyline points="32,50 44,62 68,36" fill="none" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
