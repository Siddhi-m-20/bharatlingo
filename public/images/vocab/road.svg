<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-road" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#F1F5F9"/>
    </linearGradient>
    <linearGradient id="badge-road" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#64748B"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
  </defs>
  <rect width="160" height="160" rx="24" fill="url(#bg-road)"/>
  <g transform="translate(30, 30)">
    <circle cx="50" cy="50" r="42" fill="url(#badge-road)" stroke="#1E293B" stroke-width="4"/>
    <!-- Perspective Road -->
    <polygon points="44,28 56,28 72,78 28,78" fill="#1E293B"/>
    <!-- Road Lane Divider Lines -->
    <line x1="50" y1="32" x2="50" y2="40" stroke="#FBBF24" stroke-width="3" stroke-linecap="round"/>
    <line x1="50" y1="46" x2="50" y2="56" stroke="#FBBF24" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="50" y1="62" x2="50" y2="74" stroke="#FBBF24" stroke-width="4" stroke-linecap="round"/>
  </g>
</svg>
