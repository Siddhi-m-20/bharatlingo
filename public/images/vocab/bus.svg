<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-bus" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF9C3"/>
      <stop offset="100%" stop-color="#FEF08A"/>
    </linearGradient>
    <linearGradient id="bus-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FACC15"/>
      <stop offset="100%" stop-color="#EAB308"/>
    </linearGradient>
  </defs>
  <rect width="160" height="160" rx="24" fill="url(#bg-bus)"/>
  <g transform="translate(30, 25)">
    <!-- Bus Body -->
    <rect x="10" y="15" width="80" height="75" rx="10" fill="url(#bus-grad)" stroke="#CA8A04" stroke-width="3.5"/>
    <!-- Windshield -->
    <rect x="18" y="24" width="64" height="28" rx="4" fill="#38BDF8" stroke="#0284C7" stroke-width="2.5"/>
    <line x1="50" y1="24" x2="50" y2="52" stroke="#0284C7" stroke-width="2"/>
    <!-- Grille -->
    <rect x="30" y="60" width="40" height="12" rx="2" fill="#E2E8F0" stroke="#475569" stroke-width="2"/>
    <line x1="40" y1="60" x2="40" y2="72" stroke="#475569" stroke-width="1.5"/>
    <line x1="50" y1="60" x2="50" y2="72" stroke="#475569" stroke-width="1.5"/>
    <line x1="60" y1="60" x2="60" y2="72" stroke="#475569" stroke-width="1.5"/>
    <!-- Headlights -->
    <circle cx="20" cy="66" r="5" fill="#FDE047" stroke="#CA8A04" stroke-width="2"/>
    <circle cx="80" cy="66" r="5" fill="#FDE047" stroke="#CA8A04" stroke-width="2"/>
    <!-- Wheels -->
    <rect x="18" y="90" width="16" height="14" rx="4" fill="#1E293B"/>
    <rect x="66" y="90" width="16" height="14" rx="4" fill="#1E293B"/>
  </g>
</svg>
