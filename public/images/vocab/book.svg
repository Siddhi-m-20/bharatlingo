<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-book" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EEF2FF"/>
      <stop offset="100%" stop-color="#E0E7FF"/>
    </linearGradient>
    <linearGradient id="cover-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#6366F1"/>
    </linearGradient>
  </defs>
  <rect width="160" height="160" rx="24" fill="url(#bg-book)"/>
  <g transform="translate(25, 35)">
    <!-- Book Back Cover shadow -->
    <path d="M10 18 Q55 8 55 95 L10 102 Z" fill="#312E81" opacity="0.3"/>
    <!-- Left Page -->
    <path d="M15 15 Q55 5 55 90 Q15 95 15 15 Z" fill="#FFFFFF" stroke="#C7D2FE" stroke-width="2"/>
    <!-- Right Page -->
    <path d="M95 15 Q55 5 55 90 Q95 95 95 15 Z" fill="#F8FAFC" stroke="#C7D2FE" stroke-width="2"/>
    <!-- Hard Cover Wings -->
    <path d="M10 18 Q55 8 55 95 L10 102 Z" fill="none" stroke="#4338CA" stroke-width="4.5" stroke-linejoin="round"/>
    <path d="M100 18 Q55 8 55 95 L100 102 Z" fill="none" stroke="#4338CA" stroke-width="4.5" stroke-linejoin="round"/>
    <!-- Center Spine -->
    <path d="M55 5 L55 95" stroke="#4338CA" stroke-width="4" stroke-linecap="round"/>
    <!-- Text Lines on Left Page -->
    <line x1="25" y1="32" x2="47" y2="30" stroke="#94A3B8" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="25" y1="44" x2="47" y2="42" stroke="#94A3B8" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="25" y1="56" x2="42" y2="54" stroke="#94A3B8" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Text Lines on Right Page -->
    <line x1="63" y1="30" x2="85" y2="32" stroke="#94A3B8" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="63" y1="42" x2="85" y2="44" stroke="#94A3B8" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="63" y1="54" x2="80" y2="56" stroke="#94A3B8" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Ribbon Bookmark -->
    <path d="M55 20 Q65 40 65 60 L60 55 L55 60 Z" fill="#F43F5E"/>
  </g>
</svg>
