<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-auto" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F0FDF4"/>
      <stop offset="100%" stop-color="#DCFCE7"/>
    </linearGradient>
  </defs>
  <rect width="160" height="160" rx="24" fill="url(#bg-auto)"/>
  <g transform="translate(30, 25)">
    <!-- Yellow Canopy Roof -->
    <path d="M15 35 C15 15 85 15 85 35 L80 50 L20 50 Z" fill="#FACC15" stroke="#CA8A04" stroke-width="3"/>
    <!-- Green Lower Body -->
    <path d="M20 50 L80 50 L75 85 L25 85 Z" fill="#16A34A" stroke="#14532D" stroke-width="3"/>
    <!-- Windshield cutout -->
    <rect x="30" y="28" width="40" height="18" rx="2" fill="#7DD3FC" stroke="#0284C7" stroke-width="2"/>
    <!-- Center Headlight -->
    <circle cx="50" cy="65" r="7" fill="#FDE047" stroke="#CA8A04" stroke-width="2"/>
    <!-- Black Bumper -->
    <rect x="20" y="85" width="60" height="8" rx="3" fill="#1F2937"/>
    <!-- Front Single Wheel -->
    <circle cx="50" cy="98" r="9" fill="#374151" stroke="#111827" stroke-width="3"/>
    <circle cx="50" cy="98" r="3" fill="#9CA3AF"/>
  </g>
</svg>
