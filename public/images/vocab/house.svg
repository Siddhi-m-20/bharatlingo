<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-house" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF3C7"/>
      <stop offset="100%" stop-color="#FDE68A"/>
    </linearGradient>
    <linearGradient id="roof-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#EF4444"/>
      <stop offset="100%" stop-color="#B91C1C"/>
    </linearGradient>
    <linearGradient id="wall-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFBEB"/>
      <stop offset="100%" stop-color="#FEF3C7"/>
    </linearGradient>
  </defs>
  <rect width="160" height="160" rx="24" fill="url(#bg-house)"/>
  <g transform="translate(30, 30)">
    <!-- House Base Wall -->
    <rect x="20" y="45" width="60" height="55" rx="4" fill="url(#wall-grad)" stroke="#B91C1C" stroke-width="3.5"/>
    <!-- Roof -->
    <path d="M10 50 L50 15 L90 50 Z" fill="url(#roof-grad)" stroke="#B91C1C" stroke-width="3.5" stroke-linejoin="round"/>
    <!-- Door -->
    <rect x="42" y="70" width="16" height="30" rx="2" fill="#D97706" stroke="#92400E" stroke-width="2.5"/>
    <circle cx="54" cy="85" r="1.8" fill="#FEF3C7"/>
    <!-- Window -->
    <rect x="30" y="55" width="14" height="14" rx="2" fill="#93C5FD" stroke="#1E40AF" stroke-width="2"/>
    <line x1="37" y1="55" x2="37" y2="69" stroke="#1E40AF" stroke-width="1.5"/>
    <line x1="30" y1="62" x2="44" y2="62" stroke="#1E40AF" stroke-width="1.5"/>
    <!-- Chimney -->
    <rect x="62" y="24" width="10" height="18" fill="#B91C1C" stroke="#7F1D1D" stroke-width="2"/>
    <!-- Smoke puff -->
    <circle cx="72" cy="18" r="4" fill="#E2E8F0" opacity="0.8"/>
    <circle cx="76" cy="12" r="5" fill="#E2E8F0" opacity="0.6"/>
  </g>
</svg>
