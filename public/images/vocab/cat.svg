<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-cat" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF7ED"/>
      <stop offset="100%" stop-color="#FFEDD5"/>
    </linearGradient>
    <linearGradient id="cat-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FB923C"/>
      <stop offset="100%" stop-color="#C2410C"/>
    </linearGradient>
  </defs>
  <rect width="160" height="160" rx="24" fill="url(#bg-cat)"/>
  <g transform="translate(30, 25)">
    <!-- Ears -->
    <polygon points="25,50 15,18 42,32" fill="url(#cat-grad)" stroke="#9A3412" stroke-width="3"/>
    <polygon points="75,50 85,18 58,32" fill="url(#cat-grad)" stroke="#9A3412" stroke-width="3"/>
    <polygon points="27,45 20,24 38,34" fill="#FCA5A5"/>
    <polygon points="73,45 80,24 62,34" fill="#FCA5A5"/>
    <!-- Head -->
    <ellipse cx="50" cy="55" rx="36" ry="28" fill="url(#cat-grad)" stroke="#9A3412" stroke-width="3.5"/>
    <!-- Body -->
    <path d="M25 75 Q15 110 50 110 Q85 110 75 75 Z" fill="url(#cat-grad)" stroke="#9A3412" stroke-width="3.5"/>
    <!-- Eyes -->
    <ellipse cx="38" cy="50" rx="4" ry="6" fill="#15803D"/>
    <ellipse cx="62" cy="50" rx="4" ry="6" fill="#15803D"/>
    <circle cx="39" cy="48" r="1.5" fill="#FFFFFF"/>
    <circle cx="63" cy="48" r="1.5" fill="#FFFFFF"/>
    <!-- Nose & Mouth -->
    <polygon points="50,57 46,62 54,62" fill="#F43F5E"/>
    <path d="M46 64 Q50 68 50 64 Q50 68 54 64" stroke="#9A3412" stroke-width="2" fill="none"/>
    <!-- Whiskers -->
    <line x1="22" y1="56" x2="6" y2="52" stroke="#9A3412" stroke-width="2" stroke-linecap="round"/>
    <line x1="20" y1="62" x2="5" y2="64" stroke="#9A3412" stroke-width="2" stroke-linecap="round"/>
    <line x1="78" y1="56" x2="94" y2="52" stroke="#9A3412" stroke-width="2" stroke-linecap="round"/>
    <line x1="80" y1="62" x2="95" y2="64" stroke="#9A3412" stroke-width="2" stroke-linecap="round"/>
  </g>
</svg>
