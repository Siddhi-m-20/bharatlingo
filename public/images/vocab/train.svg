<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-train" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F0F9FF"/>
      <stop offset="100%" stop-color="#E0F2FE"/>
    </linearGradient>
    <linearGradient id="train-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#0369A1"/>
    </linearGradient>
  </defs>
  <rect width="160" height="160" rx="24" fill="url(#bg-train)"/>
  <g transform="translate(35, 25)">
    <!-- Train Body -->
    <path d="M15 25 C15 15 75 15 75 25 L75 85 C75 92 68 95 60 95 L30 95 C22 95 15 92 15 85 Z" fill="url(#train-grad)" stroke="#0C4A6E" stroke-width="3.5"/>
    <!-- Windshield -->
    <path d="M22 28 C22 24 68 24 68 28 L68 50 L22 50 Z" fill="#7DD3FC" stroke="#0C4A6E" stroke-width="2.5"/>
    <line x1="45" y1="26" x2="45" y2="50" stroke="#0C4A6E" stroke-width="2"/>
    <!-- Red Accent Stripe -->
    <rect x="15" y="60" width="60" height="10" fill="#EF4444"/>
    <!-- Headlights -->
    <circle cx="28" cy="78" r="6" fill="#FDE047" stroke="#CA8A04" stroke-width="2"/>
    <circle cx="62" cy="78" r="6" fill="#FDE047" stroke="#CA8A04" stroke-width="2"/>
    <!-- Tracks base -->
    <line x1="5" y1="105" x2="85" y2="105" stroke="#475569" stroke-width="4"/>
    <line x1="15" y1="105" x2="10" y2="112" stroke="#475569" stroke-width="3"/>
    <line x1="45" y1="105" x2="45" y2="112" stroke="#475569" stroke-width="3"/>
    <line x1="75" y1="105" x2="80" y2="112" stroke="#475569" stroke-width="3"/>
  </g>
</svg>
