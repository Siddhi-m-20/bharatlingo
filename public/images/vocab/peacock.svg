<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-peacock" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ECFDF5"/>
      <stop offset="100%" stop-color="#D1FAE5"/>
    </linearGradient>
    <linearGradient id="feather-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
  </defs>
  <rect width="160" height="160" rx="24" fill="url(#bg-peacock)"/>
  <g transform="translate(30, 25)">
    <!-- Fan Tail Feathers -->
    <path d="M50 80 L10 30 C20 15 80 15 90 30 Z" fill="url(#feather-grad)" opacity="0.8"/>
    <!-- Feather eye spots -->
    <circle cx="28" cy="32" r="7" fill="#2563EB" stroke="#F59E0B" stroke-width="2"/>
    <circle cx="50" cy="22" r="7" fill="#2563EB" stroke="#F59E0B" stroke-width="2"/>
    <circle cx="72" cy="32" r="7" fill="#2563EB" stroke="#F59E0B" stroke-width="2"/>
    <!-- Body -->
    <path d="M50 40 C42 40 40 55 45 75 Q50 95 60 95 C70 95 72 75 62 55 Z" fill="#1D4ED8" stroke="#1E3A8A" stroke-width="3"/>
    <!-- Head Crest -->
    <line x1="50" y1="40" x2="50" y2="28" stroke="#1D4ED8" stroke-width="2"/>
    <line x1="47" y1="40" x2="43" y2="30" stroke="#1D4ED8" stroke-width="2"/>
    <line x1="53" y1="40" x2="57" y2="30" stroke="#1D4ED8" stroke-width="2"/>
    <circle cx="50" cy="26" r="2.5" fill="#F59E0B"/>
    <circle cx="43" cy="28" r="2.5" fill="#F59E0B"/>
    <circle cx="57" cy="28" r="2.5" fill="#F59E0B"/>
    <!-- Beak -->
    <polygon points="50,46 42,48 50,52" fill="#F59E0B"/>
    <!-- Eye -->
    <circle cx="52" cy="44" r="2" fill="#FFFFFF"/>
  </g>
</svg>
