<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-ele" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F1F5F9"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
    <linearGradient id="ele-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#94A3B8"/>
      <stop offset="100%" stop-color="#64748B"/>
    </linearGradient>
  </defs>
  <rect width="160" height="160" rx="24" fill="url(#bg-ele)"/>
  <g transform="translate(25, 25)">
    <!-- Big Ears -->
    <path d="M25 25 C5 25 2 75 28 80 C35 60 32 35 25 25 Z" fill="#CBD5E1" stroke="#475569" stroke-width="3"/>
    <path d="M85 25 C105 25 108 75 82 80 C75 60 78 35 85 25 Z" fill="#CBD5E1" stroke="#475569" stroke-width="3"/>
    <!-- Head -->
    <ellipse cx="55" cy="50" rx="35" ry="30" fill="url(#ele-grad)" stroke="#475569" stroke-width="3.5"/>
    <!-- Trunk -->
    <path d="M55 65 Q55 105 72 105 Q82 105 78 95" fill="none" stroke="url(#ele-grad)" stroke-width="12" stroke-linecap="round"/>
    <path d="M55 65 Q55 105 72 105 Q82 105 78 95" fill="none" stroke="#475569" stroke-width="3.5" stroke-linecap="round"/>
    <!-- Tusks -->
    <path d="M42 72 Q35 85 30 75" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round"/>
    <path d="M68 72 Q75 85 80 75" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round"/>
    <!-- Eyes -->
    <circle cx="42" cy="45" r="4" fill="#0F172A"/>
    <circle cx="68" cy="45" r="4" fill="#0F172A"/>
    <circle cx="43" cy="44" r="1.5" fill="#FFFFFF"/>
    <circle cx="69" cy="44" r="1.5" fill="#FFFFFF"/>
  </g>
</svg>
