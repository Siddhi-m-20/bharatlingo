<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-clock" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EEF2FF"/>
      <stop offset="100%" stop-color="#E0E7FF"/>
    </linearGradient>
  </defs>
  <rect width="160" height="160" rx="24" fill="url(#bg-clock)"/>
  <g transform="translate(30, 30)">
    <!-- Clock Outer Frame -->
    <circle cx="50" cy="50" r="44" fill="#FFFFFF" stroke="#4338CA" stroke-width="4.5"/>
    <!-- Hour Ticks -->
    <line x1="50" y1="12" x2="50" y2="18" stroke="#4338CA" stroke-width="3" stroke-linecap="round"/>
    <line x1="50" y1="82" x2="50" y2="88" stroke="#4338CA" stroke-width="3" stroke-linecap="round"/>
    <line x1="12" y1="50" x2="18" y2="50" stroke="#4338CA" stroke-width="3" stroke-linecap="round"/>
    <line x1="82" y1="50" x2="88" y2="50" stroke="#4338CA" stroke-width="3" stroke-linecap="round"/>
    <!-- Hands pointing 10:10 -->
    <line x1="50" y1="50" x2="30" y2="30" stroke="#1E1B4B" stroke-width="4.5" stroke-linecap="round"/>
    <line x1="50" y1="50" x2="75" y2="32" stroke="#4338CA" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="50" y1="50" x2="50" y2="76" stroke="#EF4444" stroke-width="2" stroke-linecap="round"/>
    <!-- Center Pin -->
    <circle cx="50" cy="50" r="4.5" fill="#EF4444"/>
  </g>
</svg>
