<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-sun" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFBEB"/>
      <stop offset="100%" stop-color="#FEF3C7"/>
    </linearGradient>
    <linearGradient id="sun-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
  </defs>
  <rect width="160" height="160" rx="24" fill="url(#bg-sun)"/>
  <g transform="translate(30, 30)">
    <!-- Sun Rays -->
    <g stroke="#F59E0B" stroke-width="4.5" stroke-linecap="round">
      <line x1="50" y1="10" x2="50" y2="2" />
      <line x1="50" y1="90" x2="50" y2="98" />
      <line x1="10" y1="50" x2="2" y2="50" />
      <line x1="90" y1="50" x2="98" y2="50" />
      <line x1="22" y1="22" x2="16" y2="16" />
      <line x1="78" y1="78" x2="84" y2="84" />
      <line x1="22" y1="78" x2="16" y2="84" />
      <line x1="78" y1="22" x2="84" y2="16" />
    </g>
    <!-- Core Sun Circle -->
    <circle cx="50" cy="50" r="30" fill="url(#sun-grad)" stroke="#D97706" stroke-width="3.5"/>
    <!-- Gentle Face details -->
    <circle cx="42" cy="45" r="3" fill="#78350F"/>
    <circle cx="58" cy="45" r="3" fill="#78350F"/>
    <path d="M42 56 Q50 63 58 56" fill="none" stroke="#78350F" stroke-width="2.5" stroke-linecap="round"/>
  </g>
</svg>
