<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <rect width="512" height="512" rx="128" fill="#0B8F62"/>
  <circle cx="256" cy="256" r="180" fill="#065F46" opacity="0.3"/>
  <defs>
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stopColor="#10B981"/>
      <stop offset="60%" stopColor="#0B8F62"/>
      <stop offset="100%" stopColor="#065F46"/>
    </linearGradient>
    <linearGradient id="bellyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stopColor="#38BDF8"/>
      <stop offset="50%" stopColor="#0284C7"/>
      <stop offset="100%" stopColor="#0369A1"/>
    </linearGradient>
    <linearGradient id="beakGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#FBBF24"/>
      <stop offset="100%" stopColor="#EA580C"/>
    </linearGradient>
    <linearGradient id="featherGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#34D399"/>
      <stop offset="100%" stopColor="#059669"/>
    </linearGradient>
  </defs>
  <!-- Peacock Fan Plumage -->
  <g transform="translate(256, 280) scale(2.2)">
    <ellipse cx="-45" cy="-35" rx="14" ry="28" transform="rotate(-35 -45 -35)" fill="url(#featherGrad)"/>
    <ellipse cx="-25" cy="-55" rx="14" ry="28" transform="rotate(-15 -25 -55)" fill="url(#featherGrad)"/>
    <ellipse cx="0" cy="-65" rx="15" ry="30" fill="url(#featherGrad)"/>
    <ellipse cx="25" cy="-55" rx="14" ry="28" transform="rotate(15 25 -55)" fill="url(#featherGrad)"/>
    <ellipse cx="45" cy="-35" rx="14" ry="28" transform="rotate(35 45 -35)" fill="url(#featherGrad)"/>
    <!-- Feather Eyespots -->
    <circle cx="-45" cy="-42" r="5" fill="#38BDF8"/>
    <circle cx="-25" cy="-62" r="5" fill="#38BDF8"/>
    <circle cx="0" cy="-72" r="5.5" fill="#38BDF8"/>
    <circle cx="25" cy="-62" r="5" fill="#38BDF8"/>
    <circle cx="45" cy="-42" r="5" fill="#38BDF8"/>
    <!-- Main Body -->
    <ellipse cx="0" cy="5" rx="28" ry="34" fill="url(#bodyGrad)"/>
    <ellipse cx="0" cy="10" rx="20" ry="25" fill="url(#bellyGrad)"/>
    <!-- Head -->
    <circle cx="0" cy="-28" r="18" fill="url(#bodyGrad)"/>
    <!-- Crest Feathers -->
    <line x1="0" y1="-44" x2="-6" y2="-54" stroke="#FBBF24" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="0" y1="-44" x2="0" y2="-56" stroke="#FBBF24" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="0" y1="-44" x2="6" y2="-54" stroke="#FBBF24" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="-6" cy="-54" r="3" fill="#F59E0B"/>
    <circle cx="0" cy="-56" r="3.5" fill="#F59E0B"/>
    <circle cx="6" cy="-54" r="3" fill="#F59E0B"/>
    <!-- Eyes -->
    <circle cx="-6" cy="-30" r="4.5" fill="white"/>
    <circle cx="6" cy="-30" r="4.5" fill="white"/>
    <circle cx="-5" cy="-30" r="2.5" fill="#1E293B"/>
    <circle cx="7" cy="-30" r="2.5" fill="#1E293B"/>
    <!-- Beak -->
    <polygon points="0,-24 -5,-18 5,-18" fill="url(#beakGrad)"/>
    <!-- Little Feet -->
    <ellipse cx="-10" cy="40" rx="7" ry="3" fill="#F59E0B"/>
    <ellipse cx="10" cy="40" rx="7" ry="3" fill="#F59E0B"/>
  </g>
</svg>
